[project]
name = "finbot"
version = "0.1.0"
description = "Production-grade algorithmic trading bot for Indian stock markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    
    # Angel One SDK
    "smartapi-python",
    
    # Database
    "supabase",
    "redis",
    
    # Data processing
    "pandas",
    "pandas-ta",
    "numpy",
    
    # Validation & Config
    "pydantic",
    "pydantic-settings",
    
    # Auth & Security
    "pyotp",
    "python-jose[cryptography]",
    
    # Optimization
    "optuna",
    
    # Scheduling
    "schedule",
    "apscheduler",
    
    # Logging
    "loguru",
    
    # HTTP client
    "httpx",
    
    # Websockets
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
